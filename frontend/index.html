<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32" />
    <link rel="apple-touch-icon" id="apple-touch-icon" href="/logo_dark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aperix AI</title>
    <script>
      (function () {
        try {
          var key = "aperix-theme";
          var stored = localStorage.getItem(key);
          var dark = stored === "dark";
          if (dark) document.documentElement.classList.add("dark");
          var icon = document.getElementById("apple-touch-icon");
          if (icon) icon.href = dark ? "/logo_light.png" : "/logo_dark.png";
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
