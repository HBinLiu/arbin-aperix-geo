# Resident GEO web-crawl + self-hosted Browserless (Chromium pool).
# Usage (from this directory):
#   docker compose up -d
# Live view (optional):
#   GEO_WEB_CRAWL_LIVE_VIEW=1 \
#   GEO_WEB_CRAWL_LIVE_VIEW_PAUSE_S=25 \
#   GEO_WEB_CRAWL_LIVE_VIEW_SCREENSHOT_DIR=/tmp/geo-crawl-live \
#   docker compose up -d
# Then open http://127.0.0.1:3001/ and/or watch ./live-shots/

services:
  browserless:
    image: ghcr.io/browserless/chromium
    shm_size: "2gb"
    # Host 3000 is often taken (e.g. Payload); use 3001 for Debugger / liveURL.
    # Crawl still uses the compose network: ws://browserless:3000/chromium
    ports:
      - "${BROWSERLESS_HOST_PORT:-3001}:3000"
    environment:
      TOKEN: ${BROWSERLESS_TOKEN:-arbin_aperix_geo_crawl}
      HOST: "0.0.0.0"
      CONCURRENT: ${BROWSERLESS_CONCURRENT:-4}
      QUEUED: ${BROWSERLESS_QUEUED:-8}
      # Crawl jobs often need minutes; default Browserless TIMEOUT is 30s.
      TIMEOUT: ${BROWSERLESS_TIMEOUT_MS:-600000}
    restart: unless-stopped

  geo-web-crawl:
    image: ${GEO_WEB_CRAWL_IMAGE:-aperix/geo-web-crawl:latest}
    build:
      context: ../..
      dockerfile: docker/geo-web-crawl/Dockerfile
    ports:
      - "9410:9410"
    environment:
      GEO_WEB_CRAWL_CONCURRENCY: ${GEO_WEB_CRAWL_CONCURRENCY:-2}
      GEO_WEB_CRAWL_TOKEN: ${GEO_WEB_CRAWL_TOKEN:-Hp2SKSrnrJr8PHCAQ9Qe7aaAszaYKxRm}
      # CDP endpoint (connect_over_cdp) — version-tolerant vs Browserless latest.
      # Do NOT use /chromium/playwright unless Playwright client == Browserless PW version.
      GEO_WEB_CRAWL_BROWSER_WS_URL: ws://browserless:3000/chromium
      GEO_WEB_CRAWL_BROWSERLESS_TOKEN: ${BROWSERLESS_TOKEN:-arbin_aperix_geo_crawl}
      # Live view: off by default. Set GEO_WEB_CRAWL_LIVE_VIEW=1 to enable.
      GEO_WEB_CRAWL_LIVE_VIEW: ${GEO_WEB_CRAWL_LIVE_VIEW:-0}
      GEO_WEB_CRAWL_LIVE_VIEW_PAUSE_S: ${GEO_WEB_CRAWL_LIVE_VIEW_PAUSE_S:-0}
      GEO_WEB_CRAWL_LIVE_VIEW_BASE_URL: ${GEO_WEB_CRAWL_LIVE_VIEW_BASE_URL:-http://127.0.0.1:3001}
      GEO_WEB_CRAWL_LIVE_VIEW_SCREENSHOT_DIR: ${GEO_WEB_CRAWL_LIVE_VIEW_SCREENSHOT_DIR:-}
      GEO_WEB_CRAWL_LIVE_VIEW_SCREENSHOT_S: ${GEO_WEB_CRAWL_LIVE_VIEW_SCREENSHOT_S:-5}
    volumes:
      - ./live-shots:/tmp/geo-crawl-live
    depends_on:
      - browserless
    restart: unless-stopped
