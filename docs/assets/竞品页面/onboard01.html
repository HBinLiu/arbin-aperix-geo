        const retryKey = "__dageno_asset_retry_once__"

        if (sessionStorage.getItem(retryKey)) {
          return
        }

        const retry = () => {
          if (sessionStorage.getItem(retryKey)) {
            return
          }

          sessionStorage.setItem(retryKey, "1")
          const url = new URL(window.location.href)
          url.searchParams.set("__asset_retry__", String(Date.now()))
          window.location.replace(url.toString())
        }

        window.addEventListener(
          "error",
          (event) => {
            const target = event.target
            if (!(target instanceof HTMLLinkElement || target instanceof HTMLScriptElement)) {
              return
            }

            if (target instanceof HTMLLinkElement && target.rel === "stylesheet") {
              retry()
              return
            }

            if (target instanceof HTMLScriptElement && target.type === "module") {
              retry()
            }
          },
          true,
        )
      })()
