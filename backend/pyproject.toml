[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aperix-geo"
version = "0.1.0"
description = "Aperix AI — FastAPI + Celery backend (monorepo: see /README.md)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "openai>=1.55.0",
    "dashscope>=1.22.0",
    # requests 2.32 与 chardet>=6 不兼容；Crawl4AI 仅需 >=5.2
    "chardet>=5.2.0,<6",
    "crawl4ai>=0.8.0",
    "beautifulsoup4>=4.12.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "email-validator>=2.2.0",
    "alibabacloud-dysmsapi20170525>=4.0.0",
    "publicsuffix2>=1.0.0",
    "validators>=0.34.0",
    "dnspython>=2.6.0",
]

[project.scripts]
aperix-geo-api = "aperix_geo.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
