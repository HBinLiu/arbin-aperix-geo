# 微信服务号模板消息列表（类目模板）。
# key：代码里查找用；data：公众平台关键词 → 取值来源。
# source 可选：title | body | time | available | phone | amount | reason
# 也可用 value 写死文案（优先于 source）。const 类字段必须与模板枚举完全一致。
# jump_base_url 也可被环境变量 WECHAT_TEMPLATE_JUMP_BASE_URL 覆盖。

jump_base_url: ""

templates:
  # 额度预警：手机号 / 账户余额(剩余次数) / 异常原因（const 枚举）
  - key: quota_warn
    template_id: "1gFxPSQIoX3XaKglXRXMdFAJ6GWff5GtcbWNj-ThNtw"
    url_path: /app/billing/plan
    data:
      - keyword: phone_number9
        source: phone
      - keyword: amount2
        source: amount
      - keyword: const4
        # 枚举：额度不足20% | 额度不足5% | 额度已用尽（由代码按预警档位写入 reason）
        source: reason
